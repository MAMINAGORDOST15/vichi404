<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — VICHI404</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #e8e8e8; font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; overflow: hidden; }
    body::before { content: ''; position: fixed; inset: 0; opacity: 0.035; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); pointer-events: none; z-index: 9999; }
    .num { font-family: 'Bebas Neue', sans-serif; font-size: clamp(120px, 25vw, 220px); line-height: 0.85; color: #fff; letter-spacing: 8px; }
    .num span { -webkit-text-stroke: 2px rgba(255,255,255,0.15); color: transparent; }
    .title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(24px, 5vw, 42px); color: rgba(255,255,255,0.6); letter-spacing: 4px; margin-top: 24px; margin-bottom: 16px; }
    .desc { font-size: 15px; color: rgba(255,255,255,0.35); line-height: 1.8; max-width: 360px; margin-bottom: 48px; }
    .home-btn { background: #fff; color: #0a0a0a; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; border: none; padding: 14px 36px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 500; border-radius: 2px; text-decoration: none; display: inline-block; transition: opacity 0.2s; }
    .home-btn:hover { opacity: 0.85; }
    .filmstrip { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 2px; height: 6px; }
    .film-f { flex: 1; background: rgba(255,255,255,0.04); }
    .film-f:nth-child(3n) { background: rgba(255,255,255,0.09); }
    canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div style="position:relative;z-index:1;">
    <div class="num">4<span>0</span>4</div>
    <div class="title">הדף לא נמצא</div>
    <div class="desc">נראה שהדף שחיפשת לא קיים. אולי הוא עבר עריכה?</div>
    <a href="/" class="home-btn">חזור לדף הבית →</a>
  </div>
  <div class="filmstrip">
    <div class="film-f"></div><div class="film-f"></div><div class="film-f"></div>
    <div class="film-f"></div><div class="film-f"></div><div class="film-f"></div>
    <div class="film-f"></div><div class="film-f"></div><div class="film-f"></div>
    <div class="film-f"></div><div class="film-f"></div><div class="film-f"></div>
  </div>
  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    c.width = window.innerWidth; c.height = window.innerHeight;
    window.addEventListener('resize', () => { c.width = window.innerWidth; c.height = window.innerHeight; });
    const pts = Array.from({length: 80}, () => ({ x: Math.random()*c.width, y: Math.random()*c.height, sx: (Math.random()-.5)*.3, sy: -Math.random()*.4-.1, o: Math.random()*.5+.1, r: Math.random()*1.5+.3 }));
    function draw() {
      ctx.clearRect(0,0,c.width,c.height);
      pts.forEach(p => {
        p.x+=p.sx; p.y+=p.sy; p.o-=.0008;
        if(p.y<0||p.o<=0){p.x=Math.random()*c.width;p.y=c.height;p.o=Math.random()*.5+.1;}
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(255,255,255,${p.o})`; ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
